# Alembic configuration for CARIA-GAP (Roadmap Phase 1).
# The database URL is intentionally NOT stored here; alembic/env.py reads it from
# the DATABASE_URL environment variable so secrets stay out of source control.
#
# Generate the first migration (after deps installed + DATABASE_URL set):
#     cd backend && alembic revision --autogenerate -m "initial schema"
# Apply it:
#     cd backend && alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
