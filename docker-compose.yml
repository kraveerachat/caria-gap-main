# Local full-stack-ish runtime for CARIA-GAP (Roadmap Phase 4): FastAPI + Postgres.
# Usage:
#   docker compose up db        # just Postgres -> hand the URL to the app/migrations
#   docker compose up           # Postgres + API (runs migrations + seed on start)
#
# DATABASE_URL for tools on the host (when only `db` is up):
#   postgresql+psycopg://caria:caria@localhost:5432/caria

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: caria
      POSTGRES_PASSWORD: caria
      POSTGRES_DB: caria
    ports:
      - "5432:5432"
    volumes:
      - caria_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caria -d caria"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://caria:caria@db:5432/caria
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Migrate + seed, then serve.
    command: >
      sh -c "alembic upgrade head &&
             python -m data.seed_db &&
             uvicorn main:app --host 0.0.0.0 --port 8000"

volumes:
  caria_pgdata:
